<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atlas Config{% endblock %}</title>
    <style>
        /* Reset */
        body, table, td, p, a, li, blockquote {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table, td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

        /* Base styles */
        body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #f4f7fa;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #333333;
        }

        /* Container */
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
        }

        /* Header */
        .email-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            padding: 30px 40px;
            text-align: center;
        }
        .email-header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
        }
        .email-header .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-top: 5px;
        }

        /* Content */
        .email-content {
            padding: 40px;
        }
        .email-content h2 {
            margin: 0 0 20px 0;
            color: #1a1a1a;
            font-size: 22px;
            font-weight: 600;
        }
        .email-content p {
            margin: 0 0 15px 0;
            color: #555555;
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            margin: 20px 0;
        }
        .btn:hover {
            background: linear-gradient(135deg, #0a58ca 0%, #084298 100%);
        }

        /* Info box */
        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid #0d6efd;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 0 4px 4px 0;
        }
        .info-box p {
            margin: 0;
            color: #666666;
            font-size: 14px;
        }

        /* Warning box */
        .warning-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 0 4px 4px 0;
        }
        .warning-box p {
            margin: 0;
            color: #856404;
            font-size: 14px;
        }

        /* Footer */
        .email-footer {
            background-color: #f8f9fa;
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }
        .email-footer p {
            margin: 0 0 10px 0;
            color: #6c757d;
            font-size: 13px;
        }
        .email-footer a {
            color: #0d6efd;
            text-decoration: none;
        }
        .email-footer .brand {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }
        .email-footer .brand a {
            color: #0d6efd;
            font-weight: 500;
        }

        /* Support contacts */
        .support-contacts {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dee2e6;
        }
        .support-contacts p {
            font-size: 12px;
        }

        /* Responsive */
        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
            }
            .email-header, .email-content, .email-footer {
                padding: 25px 20px !important;
            }
            .email-header h1 {
                font-size: 24px !important;
            }
        }
    </style>
</head>
<body>
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f4f7fa;">
        <tr>
            <td style="padding: 30px 15px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" class="email-container" style="margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                    <!-- Header -->
                    <tr>
                        <td class="email-header">
                            <h1>Atlas Config</h1>
                            <div class="subtitle">{% block header_subtitle %}{% endblock %}</div>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="email-content">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="email-footer">
                            <p>This email was sent by Atlas Config.</p>
                            <p>If you did not request this email, please ignore it.</p>

                            <div class="support-contacts">
                                <p><strong>Need help?</strong> Contact us:</p>
                                <p>
                                    <a href="mailto:akwuru.david@ul.ie">akwuru.david@ul.ie</a> |
                                    <a href="mailto:akintomide.jeremiah@ul.ie">akintomide.jeremiah@ul.ie</a> |
                                    <a href="mailto:ehealth@ul.ie">ehealth@ul.ie</a>
                                </p>
                            </div>

                            <div class="brand">
                                <p><a href="https://ehealth4cancer.ie">ehealthhub4cancer</a></p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
