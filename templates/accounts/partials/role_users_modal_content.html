<div>
    <h6 class="mb-3">Role: {{ role.name }}</h6>
    <ul class="list-group">
        {% for user in users %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ user.display_name }}</span>
            <span class="text-muted">@{{ user.username }}</span>
        </li>
        {% empty %}
        <li class="list-group-item text-muted">No users assigned to this role.</li>
        {% endfor %}
    </ul>
</div>
