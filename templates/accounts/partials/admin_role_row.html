<tr id="role-row-{{ role.id }}">
    <td>
        <div class="d-flex align-items-center">
            <div class="avatar-circle bg-primary bg-opacity-10 text-primary me-2" style="width: 32px; height: 32px; font-size: 0.75rem;">
                <i class="bi bi-shield"></i>
            </div>
            <div>
                <strong>{{ role.name }}</strong>
                {% if role.is_system_role %}
                <small class="text-muted d-block">System/Personal role</small>
                {% endif %}
            </div>
        </div>
    </td>
    <td>
        {% if role.description %}
        <button type="button" class="btn btn-outline-secondary btn-sm" title="View Description"
                data-bs-toggle="modal"
                data-bs-target="#viewDescriptionModal"
                data-role-name="{{ role.name }}"
                data-role-description="{{ role.description }}">
            <i class="bi bi-eye me-1"></i>View
        </button>
        {% else %}
        <span class="text-muted small">No description</span>
        {% endif %}
    </td>
    <td>
        <span class="badge bg-secondary">{{ role.user_count }}</span>
    </td>
    <td>
        <button type="button"
                class="btn btn-sm {% if role.is_system_role %}btn-outline-secondary{% else %}btn-outline-success{% endif %}"
                hx-post="{% url 'htmx_toggle_role_assignable' role.id %}"
                hx-target="#role-row-{{ role.id }}"
                hx-swap="outerHTML"
                title="{% if role.is_system_role %}Click to make assignable{% else %}Click to mark as system role{% endif %}">
            {% if role.is_system_role %}
            <i class="bi bi-x-circle me-1"></i>No
            {% else %}
            <i class="bi bi-check-circle me-1"></i>Yes
            {% endif %}
        </button>
    </td>
    <td>
        {% if role.is_active %}
        <span class="badge bg-success">Active</span>
        {% else %}
        <span class="badge bg-danger">Inactive</span>
        {% endif %}
    </td>
    <td class="text-end">
        <button type="button" class="btn btn-outline-primary btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#editRoleModal"
                data-role-id="{{ role.id }}"
                data-role-name="{{ role.name }}"
                data-role-description="{{ role.description }}">
            <i class="bi bi-pencil"></i>
        </button>
        <button type="button" class="btn btn-outline-info btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#viewUsersModal"
                hx-get="{% url 'htmx_role_users' role.id %}"
                hx-target="#role-users-content">
            <i class="bi bi-people"></i>
        </button>
    </td>
</tr>
