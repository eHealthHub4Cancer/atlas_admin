{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atlas Config - Management System">
    <title>{% block title %}Atlas Config{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 -->
    <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <!-- jQuery (for DataTables) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>

    <!-- HTMX Configuration -->
    <script>
        document.body.addEventListener('htmx:configRequest', function(evt) {
            evt.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
    </script>
    <script>
        (function() {
            const storageKey = 'atlas_theme_mode';
            const root = document.documentElement;
            const getSystemTheme = () =>
                window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const applyTheme = (theme) => {
                const resolved = theme === 'system' ? getSystemTheme() : theme;
                root.setAttribute('data-bs-theme', resolved);
                root.setAttribute('data-theme', resolved);
            };

            const storedTheme = localStorage.getItem(storageKey) || 'system';
            applyTheme(storedTheme);

            const syncSelects = (value) => {
                document.querySelectorAll('[data-theme-select]').forEach((select) => {
                    select.value = value;
                });
            };
            syncSelects(storedTheme);

            document.addEventListener('change', (event) => {
                const target = event.target;
                if (target instanceof HTMLSelectElement && target.matches('[data-theme-select]')) {
                    const value = target.value;
                    localStorage.setItem(storageKey, value);
                    applyTheme(value);
                    syncSelects(value);
                }
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if ((localStorage.getItem(storageKey) || 'system') === 'system') {
                    applyTheme('system');
                }
            });
        })();
    </script>

    <!-- Custom JS -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
